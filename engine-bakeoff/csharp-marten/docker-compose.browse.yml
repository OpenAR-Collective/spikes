# For looking around the database with a desktop client, such as VS Code's
# PostgreSQL extension or pgAdmin. Publishes PostgreSQL on this machine only,
# never on the network. Not for a measured run.
#   docker compose -f docker-compose.yml -f docker-compose.browse.yml up -d db
services:
  db:
    ports:
      - "127.0.0.1:${BROWSE_PORT:-5433}:5432"
