# Adapted from the HiveAR prototype by Andy Troiano
# (https://github.com/atroiano/platform-design, commit 361b6aa,
# prototype/docker-compose.yml), Apache License 2.0.
# Modified by The OpenAR Collective contributors.
# Changes: one PostgreSQL 17 and the engine, replacing the blue-green pair,
# pgBouncer, and the Caddy proxy. A one-shot migrate service applies the
# schema as the owner, the worker runs the projection reader as the runtime
# role, and a tools service runs the tests and one-off commands.
# No ports are published to the host.
name: hivear-bakeoff-python

x-engine: &engine
  image: ${IMAGE:-hivear-bakeoff-python:local}
  build: .

# The schema owner, used for migrations, tests, and verify_chain.
x-owner-env: &owner-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-evaluation-only}
  DATABASE_NAME: hivear
  DATABASE_USER: hivear
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-evaluation-only}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"

# The application connects as the runtime role, which cannot alter the
# schema or change history.
x-runtime-env: &runtime-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-evaluation-only}
  DATABASE_NAME: hivear
  DATABASE_USER: hivear_app
  DATABASE_PASSWORD: ${HIVEAR_APP_PASSWORD:-local-evaluation-only-app}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"

services:
  db:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24  # postgres:17-alpine
    restart: unless-stopped
    # A session left idle inside a transaction would hold back every read
    # model (WAX-0001), so the database ends it.
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=300000"]
    environment:
      POSTGRES_DB: hivear
      POSTGRES_USER: hivear
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-evaluation-only}
      HIVEAR_APP_PASSWORD: ${HIVEAR_APP_PASSWORD:-local-evaluation-only-app}
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivear -d hivear"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies the migrations and loads the sample bucket registry, then exits.
  migrate:
    <<: *engine
    environment: *owner-env
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_demo"]
    depends_on:
      db:
        condition: service_healthy

  # The projection reader (WAX-0001).
  worker:
    <<: *engine
    restart: unless-stopped
    environment: *runtime-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Tests by default; also verify_chain and other one-off commands, for example:
  #   docker compose run --rm tools python manage.py verify_chain
  tools:
    <<: *engine
    profiles: ["tools"]
    environment: *owner-env
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  database_data:
