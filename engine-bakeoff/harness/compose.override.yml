# The engine bake-off's shared settings. The harness applies this file on top
# of either side's own Compose file, so both sides run with the same database
# configuration and the same CPU and memory limits. Neither side sets any of
# these in its own file. A change here is a change to the method: commit it
# with its reason, and rerun earlier results under it.
#
# Limits leave the 16-thread benchmark laptop about 4 threads for Windows and
# Docker: the database 6 CPUs and 12 GB, the bench driver 4 and 4 GB, and
# the engine (projections, rules, and the register poller) 2 and 2 GB.
services:
  db:
    cpus: 6
    mem_limit: 12g
    shm_size: 1g
    command:
      - postgres
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=8GB
      - -c
      - max_connections=300
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      # A session left idle inside a transaction would hold back every
      # reader, so the database ends it.
      - -c
      - idle_in_transaction_session_timeout=300000

  engine:
    cpus: 2
    mem_limit: 2g

  bench:
    cpus: 4
    mem_limit: 4g
